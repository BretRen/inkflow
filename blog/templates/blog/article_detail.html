{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }}</title>

    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 引入 Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>

    <!-- 引入 MathJax -->
    <script type="text/javascript" async
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js">
    </script>

    <!-- 引入 Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            mermaid.initialize({ startOnLoad: true });
        });
    </script>

    <!-- 引入自定义样式 -->
    <link rel="stylesheet" type="text/css" href="{% static 'blog/style.css' %}">

    <!-- 自定义样式 -->
    <style>
        /* 确保页面最小高度，并让页脚固定在底部 */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1; /* 使主内容区域自动占据剩余空间 */
        }

        footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'article_list' %}">InkFlow</a>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container mt-5 content-wrapper">
        <div class="shadow-sm p-4 bg-white rounded">
            <!-- 标题 -->
            <h1 class="mb-3">{{ article.title }}</h1>
            <p class="text-muted mb-4">Published: {{ article.created_at }}</p>
            <hr>
            <!-- 内容 -->
            <div class="content mb-4">
                {{ content_markdown|safe }}
            </div>
            <a href="{% url 'article_list' %}" class="btn btn-secondary">Back to homepage</a>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        &copy; 2025 InkFlow | Powered by Django
    </footer>
</body>
</html>
