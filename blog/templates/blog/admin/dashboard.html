<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkFlow 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">InkFlow 管理后台</a>
            <a href="{% url 'admin_logout' %}" class="btn btn-danger btn-sm">注销</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="text-center">欢迎来到 InkFlow 管理后台</h1>
        <div class="row mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">文章管理</h5>
                        <p class="card-text">查看和管理所有文章。</p>
                        <a href="{% url 'admin_article_list' %}" class="btn btn-primary">管理文章</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">用户管理</h5>
                        <p class="card-text">查看和管理用户信息。</p>
                        <!-- 可扩展功能，当前占位 -->
                        <a href="#" class="btn btn-secondary disabled">开发中</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
