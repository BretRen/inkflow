<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">InkFlow 管理后台</a>
            <a href="{% url 'admin_logout' %}" class="btn btn-danger btn-sm">注销</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="text-center">文章管理</h1>
        <a href="{% url 'admin_article_add' %}" class="btn btn-success mb-3">添加新文章</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>标题</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for article in articles %}
                <tr>
                    <td>{{ article.title }}</td>
                    <td>{{ article.created_at }}</td>
                    <td>
                        <a href="{% url 'admin_article_edit' article.pk %}" class="btn btn-sm btn-warning">编辑</a>
                        <a href="{% url 'admin_article_delete' article.pk %}" class="btn btn-sm btn-danger"
                           onclick="return confirm('确认删除吗？')">删除</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
