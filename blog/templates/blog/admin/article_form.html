<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if article %}
            编辑文章 - {{ article.title }}
        {% else %}
            添加新文章
        {% endif %}
    </title>
    <!-- 引入 Bootstrap 和 EasyMDE -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .EasyMDEContainer .editor-toolbar button:hover {
            background-color: #e0e0e0; /* 更深的灰色背景 */
            color: #000; /* 悬停时文字变黑 */
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">InkFlow 管理后台</a>
            <a href="{% url 'admin_logout' %}" class="btn btn-danger btn-sm">注销</a>
        </div>
    </nav>

    <!-- 页面内容 -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">
            {% if article %}
                编辑文章: {{ article.title }}
            {% else %}
                添加新文章
            {% endif %}
        </h1>
        <form method="POST" class="shadow p-4 rounded bg-light">
            {% csrf_token %}
            <!-- 标题 -->
            <div class="mb-3">
                <label for="title" class="form-label fw-bold">标题</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    class="form-control"
                    value="{% if article %}{{ article.title }}{% endif %}"
                    placeholder="输入文章标题"
                    required>
            </div>

            <!-- 内容 -->
            <div class="mb-3">
                <label for="content" class="form-label fw-bold">内容</label>
                <textarea
                    id="content"
                    name="content"
                    class="form-control"
                    rows="10"
                    required>{% if article %}{{ article.content }}{% endif %}</textarea>
            </div>

            <!-- 按钮 -->
            <div class="d-flex justify-content-between">
                <a href="{% url 'admin_article_list' %}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">
                    {% if article %}
                        保存修改
                    {% else %}
                        创建文章
                    {% endif %}
                </button>
            </div>
        </form>
    </div>

    <script>
        // 初始化 EasyMDE
        const easyMDE = new EasyMDE({
            element: document.getElementById("content"),
            autoDownloadFontAwesome: false,
            spellChecker: false,
            toolbar: [
                "bold", "italic", "heading", "|",
                "unordered-list", "ordered-list",
                "quote", "code", "table", "|",
                "preview", "side-by-side", "fullscreen",
            ],
            placeholder: "在此输入内容...",
        });
    </script>
</body>
</html>
